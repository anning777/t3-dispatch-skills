<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
<marker id="ahds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
</defs>
<rect width="900" height="800" rx="12" fill="#ffffff"/>
<text x="55" y="30" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">You</text>
<text x="265" y="30" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Gemini (orchestrator)</text>
<line x1="110" y1="46" x2="110" y2="616" stroke="#e6eaef"/>
<text x="540" y="30" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Codex (GPT)</text>
<line x1="420" y1="46" x2="420" y2="616" stroke="#e6eaef"/>
<text x="780" y="30" font-size="14" font-weight="600" fill="#1a7f37" text-anchor="middle">DeepSeek (on demand)</text>
<line x1="660" y1="46" x2="660" y2="616" stroke="#e6eaef"/>
<line x1="0" y1="46" x2="900" y2="46" stroke="#e6eaef"/>
<rect x="12" y="64" width="86" height="36" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="55" y="87.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Ask</text>
<polyline points="98,82 264,82 264,118" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="128" y="120" width="272" height="50" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="264" y="142.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Orchestrator</text>
<text x="264" y="158.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Check code, data and live state</text>
<rect x="700" y="114" width="180" height="62" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="790" y="134.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Gather material</text>
<text x="790" y="150.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Logs, web research</text>
<text x="790" y="166.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Read-only</text>
<polyline points="400,134 698,134" fill="none" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ahds)"/>
<text x="540" y="128" font-size="12" fill="#1a7f37" text-anchor="middle">Brief (on demand)</text>
<polyline points="700,156 402,156" fill="none" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ahds)"/>
<text x="540" y="171" font-size="12" fill="#1a7f37" text-anchor="middle">Findings with sources, verified</text>
<polyline points="264,170 264,194" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="128" y="196" width="272" height="36" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="264" y="219.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Write one plan</text>
<rect x="450" y="192" width="180" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="540" y="211.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Independent plan</text>
<text x="540" y="227.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">GPT-6.2 Sol · read-only</text>
<polyline points="402,214 448,214" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="425" y="188" font-size="12" fill="#59636e" text-anchor="middle">One each</text>
<polyline points="264,232 264,254" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<polyline points="540,236 540,246 330,246 330,254" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="128" y="256" width="272" height="50" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="264" y="278.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Compare and merge</text>
<text x="264" y="294.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">What was adopted, what not, and why</text>
<polyline points="128,281 55,281 55,328" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="12" y="330" width="86" height="40" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="55" y="355.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Decide</text>
<polyline points="98,350 264,350 264,388" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="128" y="390" width="272" height="66" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="264" y="420.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Design, interfaces, checks</text>
<text x="264" y="436.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Commit first: sub-tasks see commits only</text>
<rect x="700" y="380" width="180" height="60" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="790" y="399.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Bulk edits, tests</text>
<text x="790" y="415.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Scripts, file sorting</text>
<text x="790" y="431.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">V4.1 Flash · max</text>
<polyline points="400,402 698,402" fill="none" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ahds)"/>
<text x="540" y="396" font-size="12" fill="#1a7f37" text-anchor="middle">Brief (on demand)</text>
<rect x="450" y="418" width="180" height="44" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="540" y="437.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Backend modules</text>
<text x="540" y="453.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">GPT-6.2 Astra</text>
<polyline points="400,440 448,440" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="425" y="434" font-size="12" fill="#59636e" text-anchor="middle">Brief</text>
<polyline points="264,456 264,478" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="128" y="480" width="272" height="46" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="264" y="500.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Frontend and copy</text>
<text x="264" y="516.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">A source for every fact; self-check</text>
<polyline points="264,526 264,546" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="128" y="548" width="272" height="60" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="264" y="575.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Read diffs, run tests</text>
<text x="264" y="591.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">The orchestrator accepts, then commits</text>
<polyline points="540,462 540,566 402,566" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<text x="470" y="560" font-size="12" fill="#59636e" text-anchor="middle">Report</text>
<polyline points="790,440 790,590 402,590" fill="none" stroke="#1a7f37" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ahds)"/>
<text x="600" y="584" font-size="12" fill="#1a7f37" text-anchor="middle">Report (command checks, spot checks)</text>
<polyline points="264,608 264,630" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="10" y="632" width="880" height="112" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="26" y="656" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Once changes are on the feature branch, go as far as you authorized</text>
<text x="520" y="656" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">(push only? stop there; two failed reviews: you decide)</text>
<rect x="26" y="670" width="123" height="60" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="87.5" y="689.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Codex review</text>
<text x="87.5" y="705.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">GPT-6.2 Sol</text>
<text x="87.5" y="721.25" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">at most 2 rounds</text>
<polyline points="149,700 169,700" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="171" y="670" width="123" height="60" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="232.5" y="705.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Push, open PR</text>
<polyline points="294,700 314,700" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="316" y="670" width="123" height="60" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="377.5" y="705.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">CI passes</text>
<polyline points="439,700 459,700" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="461" y="670" width="123" height="60" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="522.5" y="705.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Merge</text>
<polyline points="584,700 604,700" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="606" y="670" width="123" height="60" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="667.5" y="705.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Release</text>
<polyline points="729,700 749,700" fill="none" stroke="#8c959f" stroke-width="1.3" marker-end="url(#ah)"/>
<rect x="751" y="670" width="123" height="60" rx="8" fill="#ffffff" stroke="#c9d1d9" stroke-width="1"/>
<text x="812.5" y="705.25" font-size="14.5" font-weight="600" fill="#1f2328" text-anchor="middle">Verify live</text>
<rect x="14" y="765" width="28" height="16" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-dasharray="5 3"/>
<text x="50" y="778" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Green dashed: DeepSeek, called on demand. Without DeepSeek or Codex, Gemini does that work itself.</text>
</svg>
